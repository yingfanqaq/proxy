name: Release App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          cd electron-app
          npm ci

      - name: Build app
        run: npm run build:electron
        working-directory: electron-app

      - name: Package artifact
        run: ditto -c -k --keepParent dist/mac-arm64/proxyEverywhere.app dist/proxyEverywhere-macos-arm64.zip
        working-directory: electron-app

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: electron-app/dist/proxyEverywhere-macos-arm64.zip
