[project]
name = "proxyeverywhere"
version = "0.2.0"
description = "Local AI proxy flow manager"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn",
    "litellm",
    "psutil",
]

[project.scripts]
proxyeverywhere = "proxy_stack.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proxy_stack"]
